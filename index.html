<!DOCTYPE html>
<html>
<head>
  <title>Simple Blog with XSS Demo</title>
</head>
<body>
  <h1>Blog Post</h1>
  <p>This is a simple blog with a comment section vulnerable to XSS.</p>

  <h3>Comments</h3>
  <div id="comments"></div>

  <form onsubmit="addComment(event)">
    <input type="text" id="comment-input" placeholder="Enter comment">
    <button type="submit">Post Comment</button>
  </form>

  <script>
    // Load comments when page loads
    function loadComments() {
      const comments = JSON.parse(localStorage.getItem('comments') || '[]');
      const commentsDiv = document.getElementById('comments');
      
      comments.forEach(comment => {
        commentsDiv.innerHTML += `<div>${comment}</div>`;
      });
    }

    // Add new comment
    function addComment(event) {
      event.preventDefault();
      const input = document.getElementById('comment-input');
      const comment = input.value;
      
      // Save to localStorage
      const comments = JSON.parse(localStorage.getItem('comments') || [];
      comments.push(comment);
      localStorage.setItem('comments', JSON.stringify(comments));
      
      // Display immediately
      document.getElementById('comments').innerHTML += `<div>${comment}</div>`;
      input.value = '';
    }

    // Initialize
    loadComments();
  </script>
</body>
</html>
