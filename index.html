<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reflected XSS Demo</title>
</head>
<body>
  <h2>Reflected XSS Test</h2>
  <form method="GET" action="">
    <label>Enter payload:</label>
    <input type="text" name="xss">
    <button type="submit">Submit</button>
  </form>

  <hr>

  <p>Result:</p>
  <div id="result"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const payload = params.get('xss');
    
    if (payload) {
      // Reflecting raw payload without sanitization
      const target = document.getElementById("result");
      target.innerHTML = payload;
    }
  </script>
</body>
</html>
