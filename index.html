<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>XSS Test Page</title>
</head>
<body>
  <h2>Welcome to the XSS Test Page</h2>
  <form method="GET" action="">
    <label for="input">Enter something:</label>
    <input type="text" id="input" name="q">
    <button type="submit">Submit</button>
  </form>

  <hr>

  <div id="output"></div>

  <script>
    // Extract query parameter
    function getParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    const q = getParam('q');
    if (q) {
      // Vulnerable output (simulating reflected XSS)
      document.getElementById('output').innerHTML = "You entered: " + q;
    }
  </script>
</body>
</html>
