<!DOCTYPE html>
<html>
<head>
  <title>XSS Demo</title>
</head>
<body>
  <h1>Blog Post #1</h1>
  <p>This is a simple blog post with a vulnerable comment section.</p>

  <h3>Comments</h3>
  <div id="comment-list"></div>

  <form id="comment-form">
    <input type="text" id="comment" placeholder="Leave a comment" required>
    <button type="submit">Submit</button>
  </form>

  <p>Try entering this XSS payload: <code>&lt;script&gt;alert('XSS')&lt;/script&gt;</code></p>
<script>
    const params = new URLSearchParams(window.location.search);
    const name = params.get("name");

    if (name) {
      document.getElementById("output").innerHTML = name;

      // Check if the reflected name contains the XSS payload
      if (name.includes("<script>") || name.includes("<img")) {
        var flag = "flag";
        alert("Flag: " + flag);
      }
    }
  </script>
</body>
</html>
