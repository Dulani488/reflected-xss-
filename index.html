<!DOCTYPE html>
<html>
<head>
  <title>XSS Demo</title>
</head>
<body>
  <h1>Blog Post #1</h1>
  <p>This is a simple blog post with a vulnerable comment section.</p>

  <h3>Comments</h3>
  <div id="comment-list"></div>

  <form id="comment-form">
    <input type="text" id="comment" placeholder="Leave a comment" required>
    <button type="submit">Submit</button>
  </form>

  <p>Try entering this XSS payload: <code>&lt;script&gt;alert('XSS')&lt;/script&gt;</code></p>

  <script>
    // Load existing comments
    const comments = JSON.parse(localStorage.getItem('comments') || '[]');
    const commentList = document.getElementById('comment-list');
    
    comments.forEach(comment => {
      commentList.innerHTML += `<div>${comment}</div>`;
    });

    // Handle new comments
    document.getElementById('comment-form').onsubmit = function(e) {
      e.preventDefault();
      const comment = document.getElementById('comment').value;
      comments.push(comment);
      localStorage.setItem('comments', JSON.stringify(comments));
      location.reload();
    };
  </script>
</body>
</html>
